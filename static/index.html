<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Simple Finance Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Finance Tracker</h1>

      <section class="balance">
        <div class="stats">
          <div class="stat">
            <div class="label">Total</div>
            <div class="value" id="total">$0.00</div>
          </div>
          <div class="stat">
            <div class="label">Income</div>
            <div class="value" id="income">$0.00</div>
          </div>
          <div class="stat">
            <div class="label">Outcome</div>
            <div class="value" id="outcome">$0.00</div>
          </div>
          <div class="stat">
            <div class="label">Debt</div>
            <div class="value" id="debt">$0.00</div>
          </div>
        </div>
      </section>

      <section class="add">
        <h2>Add Transaction</h2>
        <form id="tx-form">
          <input id="description" placeholder="Description" required />
          <input id="amount" placeholder="Amount (use - for expense)" required />
          <select id="type">
            <option value="income">Income</option>
            <option value="outcome">Outcome</option>
            <option value="debt">Debt</option>
            <option value="other">Other</option>
          </select>
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="list">
        <h2>Transactions</h2>
        <ul id="tx-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
